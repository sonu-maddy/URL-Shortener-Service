spring.application.name=url-shortener

# ---------- PostgreSQL ----------
#spring.datasource.url= jdbc:postgresql://ep-dark-pond-aukrujsb-pooler.c-10.us-east-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_tunx2Ywa3lbf&sslmode=require&channelBinding=require
#spring.datasource.username=neondb_owner
#spring.datasource.password=npg_tunx2Ywa3lbf

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Server ----------
server.port=${PORT:8080}

# ---------- App / JWT ----------
# 256-bit (32+ char) secret used to sign JWTs - change this in production, ideally load from an env var
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Base URL used to build the short link returned to clients
#app.base-url=http://localhost:8080/r/

app.base-url=${BASE_URL}