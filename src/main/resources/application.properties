spring.application.name=url-shortener

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Server ----------
server.port=8080

# ---------- App / JWT ----------
# 256-bit (32+ char) secret used to sign JWTs - change this in production, ideally load from an env var
app.jwt.expiration-ms=86400000

app.jwt.secret = ${JWT_SECRET}

# Base URL used to build the short link returned to clients
#app.base-url=http://localhost:8080/r/

app.base-url=${BASE_URL}
